name: SEDCO P0 syntax checks
on:
  push:
    branches:
      - 'chatgpt/sedco-p0-workflow'
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Permission regression (no database)
        run: php tests/workflow-permissions.php
      - name: JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
