<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Training System: Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="sedco-saas.css?v=20261007-07">
  <link rel="stylesheet" href="sedco-shell.css?v=20261007-15">
</head>
<body class="app-page global-search-page" data-page="global-search">
<main class="sts-page-content">
  <div class="sts-page-shell">
    <header class="sts-page-heading global-search-heading">
      <div>
        <div class="sts-eyebrow">Find anything</div>
        <h1>Search STS</h1>
        <p>Search application number, applicant, training title, department, form type or status.</p>
      </div>
    </header>

    <div class="global-search-form">
      <div class="global-search-input">
        <i class="bi bi-search"></i>
        <input id="globalSearchInput" type="search" placeholder="Try APP-2026, staff name, course title or department..." autocomplete="off" autofocus>
      </div>
      <select id="globalSearchType">
        <option value="">All forms</option>
        <option value="BPL">BPL</option>
        <option value="PKK">PKK</option>
        <option value="TEA">TEA</option>
      </select>
      <select id="globalSearchStatus">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="correction">Needs correction</option>
        <option value="rejected">Rejected</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <section class="global-search-empty" id="globalSearchEmpty">
      <span><i class="bi bi-search"></i></span>
      <h2>Search your training workspace</h2>
      <p>Use one keyword to find an application without opening multiple pages.</p>
      <div><em>Application no.</em><em>Applicant</em><em>Course</em><em>Department</em></div>
    </section>

    <div class="global-search-meta" id="globalSearchMeta" hidden>
      <strong id="globalSearchCount">0</strong><span>results</span>
    </div>
    <section class="global-search-results" id="globalSearchResults"></section>
  </div>
</main>
<script src="global-search.js?v=20261007-01"></script>
<script src="sedco-shell.js?v=20261007-05"></script>
</body>
</html>
