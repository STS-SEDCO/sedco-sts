<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Training System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="sedco-saas.css?v=20260930-68">
</head>
<body class="auth-page login-page">
  <section class="vh-100 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card text-black">
            <div class="card-body p-md-5">
              <div class="row align-items-center justify-content-center">
                <div class="col-md-10 col-lg-6">
                  <p class="text-center h1 fw-bold mb-4">SMART TRAINING SYSTEM</p>
                  <p class="text-center text-muted mb-4">GitHub Pages preview</p>

                  <form id="previewLogin">
                    <div class="form-outline mb-3">
                      <input id="previewEmail" type="email" class="form-control bg-light" placeholder="Email address" autocomplete="email" required>
                    </div>

                    <div class="form-outline mb-4">
                      <input id="previewPassword" type="password" class="form-control bg-light" placeholder="Password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>

                    <div class="text-center">
                      <small>
                        New to Smart Training System?
                        <a href="signup.html" class="text-primary text-decoration-none fw-bold">Sign up</a>
                      </small>
                    </div>
                  </form>
                </div>

                <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center">
                  <img
                    src="https://tmr.scione.com/login-assetts/images/scione-login-.svg"
                    class="img-fluid"
                    alt=""
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const roleForEmail = email => {
      const value = String(email || '').toLowerCase();
      if (value.includes('admin')) return 'admin';
      if (value.includes('training')) return 'training_section';
      if (value.includes('hod') || value.includes('head')) return 'head_of_department';
      if (value.includes('gm') || value.includes('manager')) return 'general_manager';
      return 'staff';
    };

    const displayNameForEmail = email => {
      const local = String(email || '').split('@')[0] || 'User';
      return local
        .replace(/[._-]+/g, ' ')
        .replace(/\b\w/g, letter => letter.toUpperCase());
    };

    document.getElementById('previewLogin').addEventListener('submit', event => {
      event.preventDefault();

      const email = document.getElementById('previewEmail').value.trim().toLowerCase();
      const password = document.getElementById('previewPassword').value;

      if (!email || !password) return;

      let existing = {};
      try {
        existing = JSON.parse(localStorage.getItem('sedcoPreviewUser') || '{}') || {};
      } catch {}

      const sameAccount = String(existing.email || '').toLowerCase() === email;

      localStorage.setItem('sedcoPreviewUser', JSON.stringify({
        ...(sameAccount ? existing : {}),
        email,
        fullname: sameAccount && existing.fullname ? existing.fullname : displayNameForEmail(email),
        role: roleForEmail(email),
        loggedInAt: new Date().toISOString()
      }));

      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
