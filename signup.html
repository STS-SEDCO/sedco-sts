<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Training Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="sedco-saas.css?v=20260930-12">
</head>
<body class="auth-page signup-page">
  <section class="vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="card p-4 p-md-5">
            <p class="text-center h3 fw-bold mb-2">Create account</p>
            <p class="text-center text-muted mb-4">GitHub Pages preview</p>

            <form id="previewSignup">
              <div class="form-outline mb-3">
                <input type="text" class="form-control bg-light" placeholder="Full name" required>
              </div>
              <div class="form-outline mb-3">
                <input type="email" class="form-control bg-light" placeholder="Email" required>
              </div>
              <div class="form-outline mb-3">
                <input type="tel" class="form-control bg-light" placeholder="Phone number">
              </div>
              <div class="form-outline mb-4">
                <input type="password" class="form-control bg-light" placeholder="Password" minlength="6" required>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>

              <div class="text-center">
                <small>
                  Already have an account?
                  <a href="index.html" class="text-primary text-decoration-none fw-bold">Sign in</a>
                </small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('previewSignup').addEventListener('submit', event => {
      event.preventDefault();
      location.href = 'index.html';
    });
  </script>
</body>
</html>
